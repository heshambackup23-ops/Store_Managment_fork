components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Search:
      name: q
      in: query
      schema:
        type: string
        maxLength: 100
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    User:
      type: object
      required: [id, name, username, roles, permissions]
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: [string, 'null']
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
    Product:
      type: object
      required: [id, name, price, description, barcode, stock, category, image_url, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: string
          pattern: '^\d+\.\d{2}$'
        description:
          type: [string, 'null']
        barcode:
          type: [string, 'null']
        stock:
          type: integer
        category:
          oneOf:
            - $ref: '#/components/schemas/Category'
            - type: 'null'
        image_url:
          type: [string, 'null']
          format: uri
        updated_at:
          type: [string, 'null']
          format: date-time
    Customer:
      type: object
      required: [id, name, phone, address]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: [string, 'null']
        address:
          type: [string, 'null']
    Supplier:
      type: object
      required: [id, name, phone, email, address, opening_balance, balance]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: [string, 'null']
        email:
          type: [string, 'null']
        address:
          type: [string, 'null']
        opening_balance:
          type: string
          pattern: '^\d+\.\d{2}$'
        balance:
          type: string
          pattern: '^\d+\.\d{2}$'
        purchases_count:
          type: [integer, 'null']
    Installment:
      type: object
      required: [id, invoice_id, customer_id, customer, product_id, product_name, product_price, payment_date, next_payment_date, paid_amount, remaining, quantity, status, items]
      properties:
        id:
          type: integer
        invoice_id:
          type: [integer, 'null']
        customer_id:
          type: [integer, 'null']
        customer:
          type: string
        product_id:
          type: [integer, 'null']
        product_name:
          type: string
        product_price:
          type: string
        payment_date:
          type: [string, 'null']
          format: date
        next_payment_date:
          type: [string, 'null']
          format: date
        paid_amount:
          type: string
        remaining:
          type: string
        quantity:
          type: integer
        status:
          type: string
        items:
          type: array
          items:
            type: object
            additionalProperties: true
    SoldProduct:
      type: object
      required: [id, name, sold_quantity]
      properties:
        id:
          type: integer
        name:
          type: string
        sold_quantity:
          type: integer
          minimum: 1
    Notification:
      type: object
      required: [id, title, message, starts_at, ends_at, created_at, is_read]
      properties:
        id:
          type: integer
        title:
          type: string
        message:
          type: string
        starts_at:
          type: [string, 'null']
          format: date-time
        ends_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: [string, 'null']
          format: date-time
        is_read:
          type: boolean
    Maintenance:
      type: object
      required: [id, name, owner, phone, address, description, status, requested_date, completed_date]
      properties:
        id:
          type: integer
        name:
          type: string
        owner:
          type: string
        phone:
          type: [string, 'null']
        address:
          type: [string, 'null']
        description:
          type: [string, 'null']
        status:
          type: string
        requested_date:
          type: string
          format: date
        completed_date:
          type: [string, 'null']
          format: date
    WalletLimit:
      type: object
      required: [label, used, limit, remaining, percent, level]
      properties:
        label:
          type: string
        used:
          type: string
        limit:
          type: [string, 'null']
        remaining:
          type: [string, 'null']
        percent:
          type: [integer, 'null']
        level:
          type: string
    Wallet:
      type: object
      required: [id, name, provider, identifier, balance, is_active, warn_at_percent, limits]
      properties:
        id:
          type: integer
        name:
          type: string
        provider:
          type: string
        identifier:
          type: [string, 'null']
        balance:
          type: string
        is_active:
          type: boolean
        warn_at_percent:
          type: integer
        limits:
          type: array
          items:
            $ref: '#/components/schemas/WalletLimit'
    WalletOverview:
      type: object
      required: [summary, wallets]
      properties:
        summary:
          type: object
          required: [wallets_total, cash, profit_today, profit_available, receivables, capital]
          properties:
            wallets_total:
              type: string
            cash:
              type: string
            profit_today:
              type: string
            profit_available:
              type: string
            receivables:
              type: string
            capital:
              type: string
        wallets:
          type: array
          items:
            $ref: '#/components/schemas/Wallet'
    WalletCashierOverview:
      type: object
      required: [wallets, transactions, outstanding]
      properties:
        wallets:
          type: array
          items:
            type: object
            required: [id, name, provider, identifier, balance, per_transaction_limit, default_commission_percent, default_commission_min, default_fee_percent, default_fee_min, default_fee_max]
            properties:
              id:
                type: integer
              name:
                type: string
              provider:
                type: string
              identifier:
                type: [string, 'null']
              balance:
                type: string
              per_transaction_limit:
                type: [string, 'null']
              default_commission_percent:
                type: string
              default_commission_min:
                type: string
              default_fee_percent:
                type: string
              default_fee_min:
                type: string
              default_fee_max:
                type: [string, 'null']
        transactions:
          type: array
          items:
            type: object
            required: [uuid, wallet_id, wallet_name, type, status, amount, commission, fee, counterparty, customer_name, payment_method, receivable, occurred_at, can_settle, can_reverse]
            properties:
              uuid:
                type: string
                format: uuid
              wallet_id:
                type: integer
              wallet_name:
                type: [string, 'null']
              type:
                type: string
                enum: [send, receive]
              status:
                type: string
              amount:
                type: string
              commission:
                type: string
              fee:
                type: string
              counterparty:
                type: [string, 'null']
              customer_name:
                type: [string, 'null']
              payment_method:
                type: string
              receivable:
                type: string
              occurred_at:
                type: [string, 'null']
                format: date-time
              can_settle:
                type: boolean
              can_reverse:
                type: boolean
        outstanding:
          type: string
    Invoice:
      type: object
      required: [id, invoice_number, customer, invoice_date, status, quantity, total_amount, paid_amount, remaining_amount, items, notes, created_at]
      properties:
        id:
          type: integer
        invoice_number:
          type: string
        customer:
          type: string
        invoice_date:
          type: string
          format: date
        status:
          type: string
          description: Existing database status; values are not normalized by this API.
        quantity:
          type: integer
        total_amount:
          type: string
          pattern: '^\d+\.\d{2}$'
        paid_amount:
          type: string
          pattern: '^\d+\.\d{2}$'
        remaining_amount:
          type: string
          pattern: '^-?\d+\.\d{2}$'
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        notes:
          type: [string, 'null']
        created_at:
          type: [string, 'null']
          format: date-time
    PaginatedResponse:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
        links:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    Error:
      type: object
      required: [error_code, message]
      properties:
        error:
          type: boolean
        error_code:
          type: string
        message:
          type: string
        status:
          type: integer
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    AuthenticationFailed:
      description: Credentials are invalid or the account is inactive
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Missing or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: User permission or token ability is insufficient
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Login rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
