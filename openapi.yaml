              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Supplier'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createSupplier
      summary: Create a supplier and initialize its opening balance
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
            pattern: '^[A-Za-z0-9-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 255
                phone:
                  type: [string, 'null']
                  maxLength: 20
                email:
                  type: [string, 'null']
                  format: email
                  maxLength: 255
                address:
                  type: [string, 'null']
                  maxLength: 255
                opening_balance:
                  type: [string, number]
                  minimum: 0
                  maximum: 99999999
                notes:
                  type: [string, 'null']
                  maxLength: 2000
      responses:
        '201':
          description: Supplier created or the stored result of an identical replay
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Supplier'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotency key reused for a different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
