name: Hilal Store Cloud Edition

on:
  push:
    branches: [cloudflare-full-migration]
  pull_request:
    paths:
      - 'cloud/**'
      - 'android/**'
      - '.github/workflows/cloudflare-store.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cloud/api/package-lock.json
            cloud/web/package-lock.json
      - run: npm ci
        working-directory: cloud/api
      - run: npm run check
        working-directory: cloud/api
      - run: npm test
        working-directory: cloud/api
      - run: npm run migrate:local
        working-directory: cloud/api
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: node scripts/import-laravel-catalog.mjs fixtures/mysql-catalog.synthetic.json
        working-directory: cloud/api
      - run: node scripts/import-laravel-personal-debts.mjs fixtures/mysql-personal-debts.synthetic.json
        working-directory: cloud/api
      - run: npm ci
        working-directory: cloud/web
      - run: npm run build
        working-directory: cloud/web

  verify-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the Android platform
        shell: bash
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --list --channel=3 > "$RUNNER_TEMP/hilal-sdk-packages.txt"
          if [ -f "${ANDROID_HOME}/platforms/android-37/android.jar" ]; then
            echo 'HILAL_ANDROID_MINOR=0' >> "$GITHUB_ENV"
          else
            package=$(awk -F'|' '{gsub(/[[:space:]]/, "", $1); if ($1 ~ /^platforms;android-37(\.[0-9]+)?$/) print $1}' \
              "$RUNNER_TEMP/hilal-sdk-packages.txt" | sort -Vu | tail -n 1)
            if [ -z "$package" ]; then
              echo 'The Google SDK repository did not list an API 37 platform for this runner.' >&2
              awk -F'|' '$1 ~ /platforms;/ {print $1}' "$RUNNER_TEMP/hilal-sdk-packages.txt"
              exit 1
            fi
            "$sdkmanager" --channel=3 "$package"
            minor=0
            if [[ "$package" =~ \.([0-9]+)$ ]]; then minor="${BASH_REMATCH[1]}"; fi
            echo "HILAL_ANDROID_MINOR=$minor" >> "$GITHUB_ENV"
          fi
      - name: Test and assemble the staging app
        working-directory: android
        run: bash gradlew :app:testStagingDebugUnitTest :app:assembleStagingDebug -PstoreCompileSdkMinor="$HILAL_ANDROID_MINOR"
      - uses: actions/upload-artifact@v4
        with:
          name: hilal-store-staging-apk
          path: android/app/build/outputs/apk/staging/debug/*.apk
          if-no-files-found: error

  deploy-demo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/cloudflare-full-migration' && vars.HENRA_STORE_DEPLOY_ENABLED == 'true'
    needs: verify
    concurrency:
      group: henra-store-demo-cloudflare
      cancel-in-progress: false
    environment: henra-store-demo
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.HENRA_STORE_CF_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.HENRA_STORE_CF_API_TOKEN }}
      HENRA_STORE_D1_ID: ${{ vars.HENRA_STORE_D1_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: cloud/api
      - run: npm ci
        working-directory: cloud/web
      - run: npm run build
        working-directory: cloud/web
      - run: node scripts/demo-config.mjs
        working-directory: cloud/api
      - run: npx --no-install wrangler d1 migrations apply DB --config .wrangler-demo.json --remote
        working-directory: cloud/api
      - run: npx --no-install wrangler deploy --config .wrangler-demo.json
        working-directory: cloud/api
      - run: node ../api/node_modules/wrangler/bin/wrangler.js pages deploy ./dist --project-name henra-store-demo-ui --branch cloudflare-full-migration
        working-directory: cloud/web
