openapi: 3.1.0
info:
  title: Store Management API
  version: 1.0.0
  description: Versioned native-client API with permission-gated reads and selected idempotent writes.
servers:
  - url: /api/v1
paths:
  /auth/token:
    post:
      operationId: issueToken
      summary: Issue a scoped personal access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, device_name]
              properties:
                username:
                  type: string
                  maxLength: 80
                password:
                  type: string
                  maxLength: 1024
                  format: password
                device_name:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        '201':
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [access_token, token_type, expires_at, user]
                    properties:
                      access_token:
                        type: string
                      token_type:
                        const: Bearer
                      expires_at:
                        type: [string, 'null']
                        format: date-time
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: revokeCurrentToken
      summary: Revoke the current personal access token
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Current token revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user's minimal profile and page permissions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /products:
    get:
      operationId: listProducts
      summary: Search and paginate products
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: category_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: in_stock
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated products
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      operationId: createProduct
      summary: Create a catalog product
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
            pattern: '^[A-Za-z0-9-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, price, stock]
              properties:
                name:
                  type: string
                  maxLength: 255
                price:
                  type: string
                  pattern: '^\d+(\.\d{1,2})?$'
                description:
                  type: [string, 'null']
                  maxLength: 2000
                barcode:
                  type: [string, 'null']
                  maxLength: 255
                stock:
                  type: integer
                  minimum: 0
                  maximum: 1000000
                category_id:
                  type: [integer, 'null']
      responses:
        '201':
          description: Product created or the stored result of an identical replay
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotency key reused for a different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /categories:
    get:
      operationId: listCategories
      summary: Search and paginate categories
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated categories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      operationId: createCategory
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
            pattern: '^[A-Za-z0-9-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 255
      responses:
        '201':
          description: Category created or the stored result of an identical replay
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotency key reused for a different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /customers:
    get:
      operationId: listCustomers
      summary: Search and paginate customers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated customers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      operationId: createCustomer
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
            pattern: '^[A-Za-z0-9-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, address]
              properties:
                name:
                  type: string
                  maxLength: 255
                phone:
                  type: string
                  maxLength: 20
                address:
                  type: string
                  maxLength: 255
      responses:
        '201':
          description: Customer created or the stored result of an identical replay
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotency key reused for a different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /invoices:
    get:
      operationId: listInvoices
      summary: Search and paginate invoice snapshots
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated invoices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      operationId: createInvoice
      summary: Create an invoice using server-side prices and stock validation
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
            pattern: '^[A-Za-z0-9-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer, product_ids, quantities, invoice_date, paid_amount]
              properties:
                customer:
                  type: string
                  maxLength: 255
                product_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: integer
                    minimum: 1
                quantities:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: integer
                    minimum: 1
                    maximum: 100000
                invoice_date:
                  type: string
                  format: date
                paid_amount:
                  type: string
                  pattern: '^\d+(\.\d{1,2})?$'
                notes:
                  type: [string, 'null']
                  maxLength: 2000
      responses:
        '201':
          description: Invoice created or the stored result of an identical replay
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotency key reused for a different payload or operation still processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /products/{product}:
    get:
      operationId: showProduct
      security:
        - bearerAuth: []
      parameters:
        - name: product
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Product detail with its category
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /categories/{category}:
    get:
      operationId: showCategory
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Category detail with product count
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Category'
                      - type: object
                        properties:
                          products_count:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateCategory
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      operationId: deleteCategory
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Category deleted; product category IDs are set to null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{customer}:
    get:
      operationId: showCustomer
      security:
        - bearerAuth: []
      parameters:
        - name: customer
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Customer detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateCustomer
      security:
        - bearerAuth: []
      parameters:
        - name: customer
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, address]
              properties:
                name:
                  type: string
                  maxLength: 255
                phone:
                  type: string
                  maxLength: 20
                address:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      operationId: deleteCustomer
      security:
        - bearerAuth: []
      parameters:
        - name: customer
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Customer deleted; installment snapshots are preserved
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /invoices/{invoice}:
    get:
      operationId: showInvoice
      security:
        - bearerAuth: []
      parameters:
        - name: invoice
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Invoice detail with item snapshots
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /invoices/{invoice}/pay:
    post:
      operationId: payInvoice
      security:
        - bearerAuth: []
      parameters:
        - name: invoice
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
            pattern: '^[A-Za-z0-9-]+$'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: [string, 'null']
                  pattern: '^\d+(\.\d{1,2})?$'
      responses:
        '200':
          description: Invoice payment and linked installment state updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /installments:
    get:
      operationId: listInstallments
      summary: Search and paginate installment snapshots
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated installment records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Installment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createInstallment
      summary: Create a standalone installment debt using current server prices
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
            pattern: '^[A-Za-z0-9-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer, paid_amount]
              oneOf:
                - required: [product_ids, quantities]
                - required: [product_name, total_amount]
              properties:
                customer:
                  type: string
                  maxLength: 255
                product_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: integer
                    minimum: 1
                quantities:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: integer
                    minimum: 1
                    maximum: 100000
                product_name:
                  type: string
                  maxLength: 255
                total_amount:
                  type: string
                  pattern: '^\d+(\.\d{1,2})?$'
                payment_date:
                  type: [string, 'null']
                  format: date
                next_payment_date:
                  type: [string, 'null']
                  format: date
                paid_amount:
                  type: string
                  pattern: '^\d+(\.\d{1,2})?$'
                notes:
                  type: [string, 'null']
                  maxLength: 2000
      responses:
        '201':
          description: Debt created or the stored result of an identical replay
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Installment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotency key reused for a different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /installments/{installment}:
    get:
      operationId: showInstallment
      security:
        - bearerAuth: []
      parameters:
        - name: installment
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Installment snapshot and server-recorded balances
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Installment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateInstallment
      security:
        - bearerAuth: []
      parameters:
        - name: installment
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
            pattern: '^[A-Za-z0-9-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer, paid_amount]
              oneOf:
                - required: [product_ids, quantities]
                - required: [product_name, total_amount]
              properties:
                customer:
                  type: string
                product_ids:
                  type: array
                  items:
                    type: integer
                quantities:
                  type: array
                  items:
                    type: integer
                product_name:
                  type: string
                total_amount:
                  type: string
                paid_amount:
                  type: string
                payment_date:
                  type: [string, 'null']
                  format: date
                next_payment_date:
                  type: [string, 'null']
                  format: date
                notes:
                  type: [string, 'null']
      responses:
        '200':
          description: Updated standalone installment
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Installment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      operationId: deleteInstallment
      security:
        - bearerAuth: []
      parameters:
        - name: installment
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
            pattern: '^[A-Za-z0-9-]+$'
      responses:
        '204':
          description: Standalone installment deleted
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /installments/{installment}/pay:
    post:
      operationId: payInstallment
      security:
        - bearerAuth: []
      parameters:
        - name: installment
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
            pattern: '^[A-Za-z0-9-]+$'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: [string, 'null']
                  pattern: '^\d+(\.\d{1,2})?$'
      responses:
        '200':
          description: Installment and linked invoice payment updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Installment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /cashier/products:
    get:
      operationId: searchCashierProducts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Top sellers for an empty query or product/barcode matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  exact:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        price:
                          type: string
                        barcode:
                          type: [string, 'null']
                        stock:
                          type: integer
                        image_url:
                          type: [string, 'null']
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cashier/checkout:
    post:
      operationId: checkoutProductCashier
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
            pattern: '^[A-Za-z0-9-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                customer:
                  type: [string, 'null']
                  maxLength: 255
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id:
                        type: integer
                      quantity:
                        type: integer
                        minimum: 1
                        maximum: 100000
                received:
                  type: [string, 'null']
                  pattern: '^\d+(\.\d{1,2})?$'
      responses:
        '201':
          description: Invoice checkout completed or identical retry returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      invoice_id:
                        type: integer
                      invoice_number:
                        type: string
                      total:
                        type: string
                      paid:
                        type: string
                      remaining:
                        type: string
                      change:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotency key conflict or checkout already processing
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /suppliers:
    get:
      operationId: listSuppliers
      summary: Search and paginate supplier payable summaries
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
