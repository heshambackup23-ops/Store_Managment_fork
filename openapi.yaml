openapi: 3.1.0
info:
  title: Store Management API
  version: 1.0.0
  description: Initial native-client API. Consequential business writes are not enabled.
servers:
  - url: /api/v1
paths:
  /auth/token:
    post:
      operationId: issueToken
      summary: Issue a scoped personal access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, device_name]
              properties:
                username:
                  type: string
                  maxLength: 80
                password:
                  type: string
                  maxLength: 1024
                  format: password
                device_name:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        '201':
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [access_token, token_type, expires_at, user]
                    properties:
                      access_token:
                        type: string
                      token_type:
                        const: Bearer
                      expires_at:
                        type: [string, 'null']
                        format: date-time
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/token:
    delete:
      operationId: revokeCurrentToken
      summary: Revoke the current personal access token
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Current token revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user's minimal profile and page permissions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /products:
    get:
      operationId: listProducts
      summary: Search and paginate products
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: category_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: in_stock
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated products
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /categories:
    get:
      operationId: listCategories
      summary: Search and paginate categories
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated categories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      operationId: createCategory
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
            pattern: '^[A-Za-z0-9-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 255
      responses:
        '201':
          description: Category created or the stored result of an identical replay
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotency key reused for a different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /customers:
    get:
      operationId: listCustomers
      summary: Search and paginate customers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated customers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      operationId: createCustomer
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
            pattern: '^[A-Za-z0-9-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, address]
              properties:
                name:
                  type: string
                  maxLength: 255
                phone:
                  type: string
                  maxLength: 20
                address:
                  type: string
                  maxLength: 255
      responses:
        '201':
          description: Customer created or the stored result of an identical replay
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotency key reused for a different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /invoices:
    get:
      operationId: listInvoices
      summary: Search and paginate invoice snapshots
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated invoices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      operationId: createInvoice
      summary: Create an invoice using server-side prices and stock validation
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 64
            pattern: '^[A-Za-z0-9-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer, product_ids, quantities, invoice_date, paid_amount]
              properties:
                customer:
                  type: string
                  maxLength: 255
                product_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: integer
                    minimum: 1
                quantities:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: integer
                    minimum: 1
                    maximum: 100000
                invoice_date:
                  type: string
                  format: date
                paid_amount:
                  type: string
                  pattern: '^\d+(\.\d{1,2})?$'
                notes:
                  type: [string, 'null']
                  maxLength: 2000
      responses:
        '201':
          description: Invoice created or the stored result of an identical replay
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Idempotency key reused for a different payload or operation still processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /products/{product}:
    get:
      operationId: showProduct
      security:
        - bearerAuth: []
      parameters:
        - name: product
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Product detail with its category
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /categories/{category}:
    get:
      operationId: showCategory
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Category detail with product count
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Category'
                      - type: object
                        properties:
                          products_count:
                            type: integer
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateCategory
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      operationId: deleteCategory
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Category deleted; product category IDs are set to null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{customer}:
    get:
      operationId: showCustomer
      security:
        - bearerAuth: []
      parameters:
        - name: customer
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Customer detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateCustomer
      security:
        - bearerAuth: []
      parameters:
        - name: customer
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, address]
              properties:
                name:
                  type: string
                  maxLength: 255
                phone:
                  type: string
                  maxLength: 20
                address:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      operationId: deleteCustomer
      security:
        - bearerAuth: []
      parameters:
        - name: customer
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Customer deleted; installment snapshots are preserved
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /invoices/{invoice}:
    get:
      operationId: showInvoice
      security:
        - bearerAuth: []
      parameters:
        - name: invoice
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Invoice detail with item snapshots
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Search:
      name: q
      in: query
      schema:
        type: string
        maxLength: 100
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    User:
      type: object
      required: [id, name, username, roles, permissions]
      properties:
        id:
          type: integer
        name:
          type: string
        username:
          type: [string, 'null']
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
    Product:
      type: object
      required: [id, name, price, description, barcode, stock, category, image_url, updated_at]
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: string
          pattern: '^\d+\.\d{2}$'
        description:
          type: string
        barcode:
          type: [string, 'null']
        stock:
          type: integer
        category:
          oneOf:
            - $ref: '#/components/schemas/Category'
            - type: 'null'
        image_url:
          type: [string, 'null']
          format: uri
        updated_at:
          type: [string, 'null']
          format: date-time
    Customer:
      type: object
      required: [id, name, phone, address]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: [string, 'null']
        address:
          type: string
    Invoice:
      type: object
      required: [id, invoice_number, customer, invoice_date, status, quantity, total_amount, paid_amount, remaining_amount, items, notes, created_at]
      properties:
        id:
          type: integer
        invoice_number:
          type: string
        customer:
          type: string
        invoice_date:
          type: string
          format: date
        status:
          type: string
          description: Existing database status; values are not normalized by this API.
        quantity:
          type: integer
        total_amount:
          type: string
          pattern: '^\d+\.\d{2}$'
        paid_amount:
          type: string
          pattern: '^\d+\.\d{2}$'
        remaining_amount:
          type: string
          pattern: '^-?\d+\.\d{2}$'
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        notes:
          type: [string, 'null']
        created_at:
          type: [string, 'null']
          format: date-time
    PaginatedResponse:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
        links:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    Error:
      type: object
      required: [error_code, message]
      properties:
        error:
          type: boolean
        error_code:
          type: string
        message:
          type: string
        status:
          type: integer
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    AuthenticationFailed:
      description: Credentials are invalid or the account is inactive
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Missing or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: User permission or token ability is insufficient
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Login rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
